<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>抢票控制台</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f6f7fb;
        color: #222;
      }
      .wrap {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .panel {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        margin-bottom: 16px;
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      .btns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        cursor: pointer;
        color: #fff;
      }
      .run {
        background: #1f8b4c;
      }
      .restart {
        background: #1769aa;
      }
      .stop {
        background: #c62828;
      }
      .debug {
        background: #7b1fa2;
      }
      .refresh {
        background: #6d4c41;
      }
      .status-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
      }
      .item {
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 6px;
        padding: 10px;
      }
      .ok {
        color: #1f8b4c;
        font-weight: 600;
      }
      .bad {
        color: #c62828;
        font-weight: 600;
      }
      #logBox {
        background: #111;
        color: #e8e8e8;
        min-height: 320px;
        border-radius: 6px;
        padding: 12px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
      #msg {
        margin-top: 8px;
        min-height: 20px;
      }
      #screenshotWrap {
        position: relative;
        display: inline-block;
        max-width: 100%;
        border: 2px solid #ddd;
        border-radius: 4px;
        cursor: crosshair;
      }
      #screenshotImg {
        display: block;
        max-width: 100%;
        height: auto;
      }
      .position-marker {
        position: absolute;
        width: 20px;
        height: 20px;
        background: rgba(255, 0, 0, 0.6);
        border: 2px solid red;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
      }
      #positionTable {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }
      #positionTable th,
      #positionTable td {
        border: 1px solid #ddd;
        padding: 6px 8px;
        text-align: center;
        font-size: 13px;
      }
      #positionTable th {
        background: #f5f5f5;
      }
      .btn-del {
        background: #c62828;
        color: #fff;
        border: 0;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font-size: 12px;
      }
      .btn-clear {
        background: #6d4c41;
      }
      .btn-exec {
        background: #e65100;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>抢票控制台</h1>
        <div class="btns">
          <button class="run" onclick="act('run')">运行抢票</button>
          <button class="restart" onclick="act('restart')">重启抢票</button>
          <button class="stop" onclick="act('stop')">停止抢票</button>
          <button class="debug" onclick="act('debugEnterSeatDetail')">
            进入选座购买详情页（调试）
          </button>
          <button class="refresh" onclick="refreshAll()">刷新状态</button>
        </div>
        <div id="msg"></div>
      </div>

      <div class="panel">
        <h2>调试点击</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <button style="background:#0277bd" onclick="takeScreenshot()">截图</button>
          <label>间隔(秒): <input id="clickInterval" type="number" value="0.5" min="0.05" step="0.05"
                 style="width:70px;"></label>
          <button class="btn-exec" onclick="debugClick()">执行点击 (<span id="posCount">0</span> 个位置)</button>
          <button class="btn-clear" onclick="clearPositions()">清空所有位置</button>
          <span id="clickMsg" style="font-size:13px;"></span>
        </div>
        <div id="screenshotWrap" style="margin-top:8px;">
          <img id="screenshotImg" alt="点击截图加载设备画面" style="display:none;" />
        </div>
        <table id="positionTable" style="display:none;">
          <thead><tr><th>序号</th><th>X</th><th>Y</th><th>次数</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <div class="panel">
        <h2>运行状态</h2>
        <div class="status-grid">
          <div class="item">脚本状态：<span id="ticketRunning">-</span></div>
          <div class="item">脚本 PID：<span id="ticketPid">-</span></div>
          <div class="item">运行时长：<span id="ticketUptime">-</span></div>
          <div class="item">最近退出码：<span id="ticketExit">-</span></div>
          <div class="item">Appium 状态：<span id="appiumHealth">-</span></div>
        </div>
      </div>

      <div class="panel">
        <h2>实时日志（最新 300 行）</h2>
        <div id="logBox"></div>
      </div>
    </div>

    <script>
      async function callApi(url, method = "GET") {
        const res = await fetch(url, { method });
        return await res.json();
      }

      function setMessage(text, ok = true) {
        const el = document.getElementById("msg");
        el.textContent = text || "";
        el.className = ok ? "ok" : "bad";
      }

      function renderStatus(status) {
        document.getElementById("ticketRunning").textContent = status.running
          ? "运行中"
          : "已停止";
        document.getElementById("ticketRunning").className = status.running
          ? "ok"
          : "bad";
        document.getElementById("ticketPid").textContent = status.pid ?? "-";
        document.getElementById("ticketUptime").textContent =
          (status.uptime_sec ?? 0) + " 秒";
        document.getElementById("ticketExit").textContent =
          status.last_exit_code ?? "-";
      }

      function renderAppium(healthy, message) {
        const el = document.getElementById("appiumHealth");
        el.textContent = healthy ? "可用" : "不可用";
        el.className = healthy ? "ok" : "bad";
        el.title = message || "";
      }

      function renderLogs(text) {
        const box = document.getElementById("logBox");
        box.textContent = text || "";
        box.scrollTop = box.scrollHeight;
      }

      async function refreshStatus() {
        const rs = await callApi("/api/status");
        if (rs.ok) {
          renderStatus(rs.data);
        }
      }

      async function refreshAppium() {
        const ra = await callApi("/api/appium-status");
        renderAppium(!!(ra.data && ra.data.healthy), ra.message);
      }

      async function refreshLogs() {
        const rl = await callApi("/api/logs");
        if (rl.ok && rl.data) {
          renderLogs(rl.data.text);
        }
      }

      async function refreshAll() {
        try {
          await Promise.all([refreshStatus(), refreshAppium(), refreshLogs()]);
        } catch (err) {
          setMessage("刷新失败: " + err, false);
        }
      }

      async function act(action) {
        const mapping = {
          run: "/api/run",
          restart: "/api/restart",
          stop: "/api/stop",
          debugEnterSeatDetail: "/api/debug-enter-seat-detail",
        };
        try {
          const r = await callApi(mapping[action], "POST");
          setMessage(r.message, !!r.ok);
          await refreshAll();
        } catch (err) {
          setMessage("操作失败: " + err, false);
        }
      }

      let deviceWidth = 1080,
        deviceHeight = 1920;

      async function takeScreenshot() {
        try {
          // 获取设备尺寸
          const ds = await callApi("/api/device-size");
          if (ds.ok && ds.data) {
            deviceWidth = ds.data.width;
            deviceHeight = ds.data.height;
          }
          // 加载截图（带时间戳防缓存）
          const img = document.getElementById("screenshotImg");
          img.src = "/api/screenshot?t=" + Date.now();
          img.style.display = "block";
          img.onload = () => {
            document.getElementById(
              "clickMsg"
            ).textContent = `截图已更新 (${deviceWidth}x${deviceHeight})`;
          };
          img.onerror = () => {
            document.getElementById("clickMsg").textContent = "截图加载失败";
            img.style.display = "none";
          };
        } catch (err) {
          setMessage("截图失败: " + err, false);
        }
      }

      // --- 多点位置管理 ---
      let positions = []; // {devX, devY, count}

      function renderPositionTable() {
        const table = document.getElementById("positionTable");
        const tbody = table.querySelector("tbody");
        tbody.innerHTML = "";
        if (positions.length === 0) {
          table.style.display = "none";
          document.getElementById("posCount").textContent = "0";
          return;
        }
        table.style.display = "";
        document.getElementById("posCount").textContent = positions.length;
        positions.forEach((p, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td>${i + 1}</td>` +
            `<td>${p.devX}</td>` +
            `<td>${p.devY}</td>` +
            `<td><input type="number" value="${p.count}" min="1" style="width:60px;" ` +
            `onchange="updateCount(${i}, this.value)"></td>` +
            `<td><button class="btn-del" onclick="removePosition(${i})">删除</button></td>`;
          tbody.appendChild(tr);
        });
      }

      function renderMarkers() {
        // 清除旧标记
        const wrap = document.getElementById("screenshotWrap");
        wrap.querySelectorAll(".position-marker").forEach(el => el.remove());

        const img = document.getElementById("screenshotImg");
        if (img.style.display === "none") return;

        const rect = img.getBoundingClientRect();
        // 使用相对于 wrap 的位置
        const wrapRect = wrap.getBoundingClientRect();
        positions.forEach((p, i) => {
          const pctX = (p.devX / deviceWidth) * 100;
          const pctY = (p.devY / deviceHeight) * 100;
          const marker = document.createElement("div");
          marker.className = "position-marker";
          marker.style.left = pctX + "%";
          marker.style.top = pctY + "%";
          marker.textContent = i + 1;
          wrap.appendChild(marker);
        });
      }

      function updateCount(idx, val) {
        const v = parseInt(val);
        if (v > 0) {
          positions[idx].count = v;
        } else {
          renderPositionTable(); // restore old value
        }
      }

      function removePosition(idx) {
        positions.splice(idx, 1);
        renderPositionTable();
        renderMarkers();
      }

      function clearPositions() {
        positions = [];
        renderPositionTable();
        renderMarkers();
        document.getElementById("clickMsg").textContent = "已清空所有位置";
      }

      // 点击截图追加位置
      document
        .getElementById("screenshotImg")
        .addEventListener("click", function (e) {
          const img = e.target;
          const rect = img.getBoundingClientRect();
          const offsetX = e.clientX - rect.left;
          const offsetY = e.clientY - rect.top;
          const scaleX = deviceWidth / rect.width;
          const scaleY = deviceHeight / rect.height;
          const devX = Math.round(offsetX * scaleX);
          const devY = Math.round(offsetY * scaleY);
          // 追加新位置（不替换）
          positions.push({ devX, devY, count: 1 });
          renderPositionTable();
          renderMarkers();
          document.getElementById(
            "clickMsg"
          ).textContent = `已添加位置 #${positions.length}: (${devX}, ${devY})`;
        });

      async function debugClick() {
        if (positions.length === 0) {
          setMessage("请先在截图上点击添加位置", false);
          return;
        }
        const interval =
          parseFloat(document.getElementById("clickInterval").value) || 0.5;
        const posList = positions.map(p => ({
          x: p.devX,
          y: p.devY,
          count: p.count,
        }));
        try {
          const res = await fetch("/api/debug-click", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ positions: posList, interval }),
          });
          const r = await res.json();
          document.getElementById("clickMsg").textContent = r.message;
          document.getElementById("clickMsg").className = r.ok ? "ok" : "bad";
          setMessage(r.message, !!r.ok);
        } catch (err) {
          setMessage("点击调试失败: " + err, false);
        }
      }

      refreshAll();
      setInterval(refreshAll, 2000);
    </script>
  </body>
</html>
